<style>
:root { color-scheme:dark; --navy:#0d254b; --blue:#2c79ed; --mint:#41c7bf; --muted:#a7b7cf; --bar:72px; --footer:94px; }
* {box-sizing:border-box} html,body{margin:0;min-height:100%;background:#07172d;color:#fff;font-family: Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} body{overflow:hidden} button,a { -webkit-tap-highlight-color:transparent } button{font:inherit;cursor:pointer} button:focus-visible,a:focus-visible{outline:3px solid #6bf4e6;outline-offset:3px}
#app{height:100dvh;min-height:440px;display:flex;flex-direction:column;background: radial-gradient(ellipse at 51% 24%,#1b365b 0,#07172d 68%)}
.topbar{height:var(--bar);flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 clamp(16px,3vw,46px);border-bottom:1px solid #ffffff18;background:#091d39dc;backdrop-filter:blur(16px);z-index:10}
.brand{display:flex;align-items:center;gap:13px;min-width:0;flex:1}.brandmark{height:36px;width:36px;border-radius:12px;background:linear-gradient(135deg,#2e80ff,#42d3c5);display:grid;place-items:center;font-size:18px;font-weight:900;box-shadow:0 6px 24px #2e80ff44}.brandcopy{display:flex;flex-direction:column;gap:2px;min-width:0}.brandcopy strong{font-size:15px;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brandcopy span{font-size:10px;letter-spacing:1.4px;color:#a7bad3}.topactions{display:flex;gap:8px}.toolbtn{border:1px solid #ffffff24;border-radius:12px;background:#ffffff0b;color:#deebff;padding:9px 13px;font-size:13px;transition:.2s}.toolbtn:hover,.toolbtn[aria-expanded="true"]{border-color:#57c6cf;background:#ffffff1d}.toolbtn svg{vertical-align:middle;margin-right:4px}
main{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px 78px 7px;overflow:hidden}
.deck{position:relative;width:min(100%,calc((100dvh - var(--bar) - var(--footer) - 44px)*16/9),1400px);aspect-ratio:16/9;isolation:isolate;border-radius:9px;box-shadow:0 28px 80px #0009,0 0 0 1px #ffffff30;overflow:hidden;background:#eff5fc;touch-action:pan-y;}
.deck img{display:block;width:100%;height:100%;object-fit:contain;position:absolute;inset:0;user-select:none;-webkit-user-drag:none}.deck img.enter-next{animation:enterNext .62s cubic-bezier(.2,.78,.22,1) both}.deck img.enter-prev{animation:enterPrev .62s cubic-bezier(.2,.78,.22,1) both}@keyframes enterNext{from{opacity:.35;transform:translateX(4%) scale(1.018)}to{opacity:1;transform:none}}@keyframes enterPrev{from{opacity:.35;transform:translateX(-4%) scale(1.018)}to{opacity:1;transform:none}}
.hotspots{position:absolute;inset:0;pointer-events:none}.hotspot{position:absolute;pointer-events:auto;background:transparent;border:2px solid transparent;border-radius:12px;transition:background .2s,border .2s;cursor:pointer}.hotspot:hover,.hotspot:focus-visible{background:#2c79ed17;border-color:#2c79ed88}.hotspot:after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#0a284c;padding:6px 10px;border-radius:8px;color:white;font-size:11px;white-space:nowrap;box-shadow:0 4px 18px #0008;opacity:0;pointer-events:none}.hotspot:hover:after,.hotspot:focus-visible:after{opacity:1}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;display:grid;place-items:center;width:45px;height:60px;border:1px solid #ffffff27;border-radius:14px;color:white;background:#ffffff14;font-size:28px;transition:background .2s,transform .2s}.arrow:hover{background:#ffffff2a;transform:translateY(-50%) scale(1.06)}.arrow:disabled{opacity:.25;cursor:not-allowed}.arrow.prev{left:clamp(10px,2vw,35px)}.arrow.next{right:clamp(10px,2vw,35px)}
.bottom{height:var(--footer);flex-shrink:0;padding:8px clamp(16px,3vw,46px) 13px;display:flex;align-items:center;gap:20px}.status{width:235px;flex-shrink:0}.status .eyebrow{font-size:10px;letter-spacing:2px;color:#61e3d5;font-weight:800;margin-bottom:6px}.status .slide-name{font-size:13px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.rail{min-width:0;flex:1;display:flex;align-items:center;gap:6px}.dot{padding:0;border:0;min-width:0;flex:1;height:7px;border-radius:100px;background:#ffffff2d;transition:background .22s,height .22s;position:relative}.dot.current{height:9px;background:#43d2c6}.dot.passed{background:#367be2}.dot:hover{height:12px;background:#80adf7}.counter{font-size:17px;font-weight:750;letter-spacing:.05em;min-width:72px;text-align:right;font-variant-numeric:tabular-nums}.counter small{font-weight:400;color:#849dbb}
.panel-backdrop{position:fixed;inset:0;background:#020c1ca8;z-index:29;opacity:0;pointer-events:none;transition:opacity .25s}.panel-backdrop.open{opacity:1;pointer-events:auto}.panel{position:fixed;right:0;top:0;bottom:0;z-index:30;width:min(445px,100vw);background:#102541;border-left:1px solid #ffffff2c;box-shadow:-16px 0 75px #0008;transform:translateX(105%);transition:transform .32s ease;display:flex;flex-direction:column}.panel.open{transform:translateX(0)}.panel-head{padding:25px 24px 20px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #ffffff1a}.panel-head small{letter-spacing:2px;color:#55d3c7;font-size:11px;font-weight:800}.panel-head h2{font-size:20px;line-height:1.35;margin:8px 0 0;word-break:keep-all}.close{background:#ffffff17;border:0;border-radius:12px;color:white;font-size:23px;width:38px;height:38px;flex:none}.panel-body{overflow-y:auto;padding:25px 24px 45px;line-height:1.85;color:#d1deee;font-size:14px;overflow-wrap:anywhere}.panel-body h3{font-size:12px;letter-spacing:1px;color:#57d5c9;margin:27px 0 9px;text-transform:uppercase}.panel-body p{margin:0}.panel-body .note{border:1px solid #ffc87966;background:#ffc8790e;padding:13px 16px;border-radius:11px;color:#ffe4b7}.panel-body a{color:#8bbdff;text-decoration:none;display:block;padding:7px 0;word-break:break-all;font-size:12px}.panel-body a:hover{text-decoration:underline}
.outline{position:fixed;z-index:25;top:calc(var(--bar) + 6px);left:clamp(12px,3vw,46px);width:min(440px,calc(100vw - 24px));max-height:calc(100dvh - var(--bar) - 100px);overflow:auto;background:#102a4b;border:1px solid #ffffff35;border-radius:16px;box-shadow:0 16px 60px #0009;padding:10px;display:none}.outline.open{display:block;animation:pop .22s ease}@keyframes pop{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}.outline-item{display:flex;gap:13px;align-items:center;padding:10px;border:0;background:transparent;color:#edf4ff;width:100%;border-radius:10px;text-align:left}.outline-item:hover,.outline-item.selected{background:#ffffff18}.outline-item.selected{outline:1px solid #47c5bb}.thumb{width:90px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;border:1px solid #ffffff24;flex:none}.outline-item span{font-size:13px;line-height:1.45}.outline-item b{display:block;color:#54d9cb;font-size:10px;letter-spacing:1px;margin-bottom:4px}.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:#90a5c2;font-size:11px;white-space:nowrap;pointer-events:none;opacity:.85}
@media(max-width:800px){:root{--bar:60px;--footer:98px}.topbar{gap:10px}.brandmark{width:31px;height:31px;border-radius:9px}.brandcopy strong{font-size:12px}.brandcopy span{font-size:8px}.topactions{gap:5px}.toolbtn{padding:8px 9px;font-size:12px}.toolbtn .label{display:none}main{padding:10px 8px 10px;}.deck{width:100%;border-radius:5px}.arrow{top:auto;bottom:10px;transform:none;width:42px;height:42px;font-size:22px;background:#10294bdc}.arrow:hover{transform:none}.arrow.prev{left:12px}.arrow.next{right:12px}.hint{display:none}.bottom{gap:12px;flex-wrap:wrap;padding:9px 16px 14px}.status{width:calc(100% - 84px)}.counter{order:1}.rail{order:2;flex-basis:100%}.panel-head{padding:20px}.panel-body{padding:20px}.panel-head h2{font-size:18px}}
@media(max-width:450px){.brandcopy span{display:none}.brandcopy strong{max-width:145px}.topactions .toolbtn{padding:7px 8px}.bottom{height:100px}.deck{box-shadow:0 12px 35px #0008}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
@media print{html,body,#app{height:auto!important;overflow:visible!important;background:white!important}.topbar,.bottom,.arrow,.hotspots,.hint,.panel,.panel-backdrop,.outline{display:none!important}main{padding:0;display:block;overflow:visible}.deck{width:100%;box-shadow:none;border-radius:0;break-after:page;page-break-after:always}.deck img{position:static;width:100%}}
</style>
